name: sram
version: 0.1.0
spec: '0.1'
kind: ip
lang: bsv
identity:
  slug: sram-tapeout-bsv
  display_name: On chip memory
  summary: A register array today; the interface will not change when a macro is
    available.
  category: memory
  subcategories:
  - sram
  ip_family: sram
  integration_profile:
  - apb4-slave
  maturity: planned
contract:
  version: 1
  ctrl:
    shape: flat
    aw: 16
    dw: 32
params:
  words:
    type: int
    default: 1024
    range:
    - 64
    - 4096
    desc: 字数。寄存器阵列，每字约 32 个触发器
features:
  sync:
    type: bool
    default: false
    desc: 同步存储：下一拍才答，也就是 SRAM/ROM 宏的形状。换宏的前提
emit:
- kind: bsv
  package: Sram
  module: mkSram
  config_type: SramCfg
  interface: SramIfc
  ctrl: regs
- kind: verilog-flat
  bus: apb4
deps:
  hwcore: ^0.1
  amba: ^0.1
area:
  base:
    points:
      '64': 23782.36
      '128': 47143.6
      '256': 94372.6
      '512': 184818.2
    per: words
  margin: 0.0048
  model: points-additive
  error:
    bound: 0.0086
    sign: over
    note: powers of two are the measured grid and one hundred and ninety two is 
      the falsification point between them; interpolation came in 0.38 percent 
      under, so the curve is lifted by 0.0048 to keep every prediction at or 
      above what was measured. The default of one thousand and twenty four words
      is extrapolated along the last segment rather than synthesised, because 
      thirty thousand flip flops once took the machine out of memory
  measured:
  - at:
      words: 64
    um2: 23782.36
  - at:
      words: 128
    um2: 47143.6
  - at:
      words: 256
    um2: 94372.6
  - at:
      words: 512
    um2: 184818.2
  corner:
    tool: ecc
    pdk: ics55
    freq_mhz: 100
    measured: '2026-09-10'
    gen_digest: sha256:bff3c6d403e7f798
test:
  # sync 这一维现在量不出真数：中立顶层只露 regs 那个口，sync 开着时
  # regs 什么也不做，整片存储被综合器扫掉，量到的是空壳（2.24 µm²）。
  # 等包装层能露出 slow 口再量，那之前不许把空壳记成实测。
  noarea:
  - sync
